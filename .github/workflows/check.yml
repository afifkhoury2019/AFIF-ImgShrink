name: Source check

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check JavaScript
        shell: pwsh
        run: |
          $files = @(
            'src/main.js', 'src/preload.js', 'src/disk.js', 'src/engine.js',
            'src/ui/app.js', 'src/ui/imager.js', 'src/ui/usb.js'
          )
          $fail = 0
          foreach ($f in $files) {
            node --check $f
            if ($LASTEXITCODE -ne 0) { Write-Host "FAILED: $f"; $fail++ } else { Write-Host "ok: $f" }
          }
          if ($fail -gt 0) { exit 1 }

      - name: Verify AS USB tab is embedded
        shell: pwsh
        run: |
          $checks = @(
            @{ file = 'src/ui/index.html'; pattern = 'data-tab="usb"' },
            @{ file = 'src/ui/index.html'; pattern = 'id="usb"' },
            @{ file = 'src/ui/index.html'; pattern = 'src="usb.js"' },
            @{ file = 'src/ui/imager.js';  pattern = 'A\.usbEnter' },
            @{ file = 'src/ui/usb.js';     pattern = 'diskStart\("write"' }
          )
          foreach ($c in $checks) {
            if (-not (Select-String -Path $c.file -Pattern $c.pattern -Quiet)) {
              Write-Error "missing $($c.pattern) in $($c.file)"
              exit 1
            }
            Write-Host "ok: $($c.pattern) in $($c.file)"
          }

      - name: Assert no external USB writer is bundled
        shell: pwsh
        run: |
          if (Select-String -Path 'src/preload.js','src/main.js' -Pattern 'launch-usb' -Quiet) {
            Write-Error 'launch-usb should be gone: the tab must not start an external program'
            exit 1
          }
          Write-Host 'ok: no external writer launch path'
