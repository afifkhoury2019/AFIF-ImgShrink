name: Source check

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check JavaScript
        shell: pwsh
        run: |
          $files = @(
            'src/main.js', 'src/preload.js', 'src/disk.js', 'src/engine.js',
            'src/ui/app.js', 'src/ui/imager.js', 'src/ui/usb.js'
          )
          $fail = 0
          foreach ($f in $files) {
            node --check $f
            if ($LASTEXITCODE -ne 0) { Write-Host "FAILED: $f"; $fail++ } else { Write-Host "ok: $f" }
          }
          if ($fail -gt 0) { exit 1 }

      - name: AS USB tab matches the Rufus control set
        shell: pwsh
        run: |
          $ids = @(
            'usbDevice', 'usbFile', 'usbPick', 'usbHash', 'usbPart', 'usbTarget',
            'usbAdvDrive', 'usbLabel', 'usbFs', 'usbCluster', 'usbAdvFormat',
            'usbQuick', 'usbExtLabel', 'usbBadBlocks', 'usbPasses', 'usbValidate',
            'usbStatus', 'usbGo', 'usbClose', 'usbFoot'
          )
          $html = Get-Content 'src/ui/index.html' -Raw
          $missing = @()
          foreach ($id in $ids) {
            if ($html -notmatch ('id="' + $id + '"')) { $missing += $id }
          }
          if ($missing.Count -gt 0) {
            Write-Error ('missing controls: ' + ($missing -join ', '))
            exit 1
          }
          Write-Host ('ok: ' + $ids.Count + ' controls present')
          if ($html -notmatch 'data-tab="usb"') { Write-Error 'missing usb tab button'; exit 1 }
          if ($html -notmatch 'src="usb.js"') { Write-Error 'usb.js not loaded'; exit 1 }

      - name: Tab is embedded, not a launcher
        shell: pwsh
        run: |
          foreach ($f in @('src/preload.js','src/main.js','src/ui/app.js')) {
            if (Select-String -Path $f -Pattern 'launch-usb|launchUsb' -Quiet) {
              Write-Error "$f must not start an external program"
              exit 1
            }
          }
          if (-not (Select-String -Path 'src/ui/usb.js' -Pattern 'diskStart' -Quiet)) {
            Write-Error 'usb.js must write through the shared disk engine'
            exit 1
          }
          Write-Host 'ok: embedded writer only'
